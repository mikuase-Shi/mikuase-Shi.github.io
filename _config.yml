title: Sheng Shi
description: Sheng Shi's personal website.
url: "https://mikuase-shi.github.io"
baseurl: ""
timezone: Asia/Shanghai

markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
permalink: /blog/:title/
excerpt_separator: "<!--more-->"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Temporarily hide the blog while preserving its source for later restoration.
exclude:
  - blog
  - _posts
