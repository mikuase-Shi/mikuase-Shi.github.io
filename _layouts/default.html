<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {% if page.layout == 'post' %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]], processEscapes: true },
      "HTML-CSS": { linebreaks: { automatic: true } },
      CommonHTML: { linebreaks: { automatic: true } }
    });
  </script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS_CHTML"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead page-width">
    <a class="home-link" href="{{ '/' | relative_url }}"><span class="home-mark" aria-hidden="true"></span>Home</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" hidden>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.2A8.7 8.7 0 0 1 9.8 3.6 8.7 8.7 0 1 0 20.4 14.2Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </nav>
  </header>
  <main class="reading-width" id="main">{{ content }}</main>
  <footer class="site-footer page-width"><p>© {{ "now" | date: "%Y" }} Sheng Shi. All rights reserved.</p><a href="#main">Back to top <span aria-hidden="true">↑</span></a></footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
